<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>E-commerce Order Processor</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

  
  <header class="bg-indigo-700 text-white shadow">
    <div class="max-w-7xl mx-auto px-4 py-5 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
      <h1 class="text-2xl font-bold tracking-tight">E-commerce Order Processor</h1>
      <!-- <nav class="flex flex-wrap gap-4 text-sm text-indigo-100">
        <a href="#orders" class="hover:text-white">Orders</a>
        <a href="#search-filter" class="hover:text-white">Search / Filter</a>
        <a href="#statistics" class="hover:text-white">Statistics</a>
        <a href="#categories" class="hover:text-white">Categories</a>
        <a href="#product-lookup" class="hover:text-white">Product Lookup</a>
        <a href="#data-processing" class="hover:text-white">Data Processing</a>
      </nav> -->
    </div>
  </header>

 
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 py-8 grid gap-6 lg:grid-cols-3">

    
    <section id="search-filter" class="lg:col-span-3 bg-white rounded-xl shadow p-6">
      <h2 class="text-lg font-semibold mb-4">Search / Filter</h2>
      <div id="search-filter-content" class="text-slate-400 text-sm">
       
      </div>
    </section>

  
    <section id="orders" class="lg:col-span-2 bg-white rounded-xl shadow p-6">
      <h2 class="text-lg font-semibold mb-4">Orders</h2>
      <div id="orders-content" class="text-slate-400 text-sm">
   
      </div>
    </section>

   
    <section id="statistics" class="bg-white rounded-xl shadow p-6">
      <h2 class="text-lg font-semibold mb-4">Statistics</h2>
      <div id="statistics-content" class="text-slate-400 text-sm">
      
      </div>
    </section>

   
    <section id="categories" class="bg-white rounded-xl shadow p-6">
      <h2 class="text-lg font-semibold mb-4">Categories</h2>
      <div id="categories-content" class="text-slate-400 text-sm">
        
      </div>
    </section>

    
    <section id="product-lookup" class="bg-white rounded-xl shadow p-6">
      <h2 class="text-lg font-semibold mb-4">Product Lookup</h2>
      <div id="product-lookup-content" class="text-slate-400 text-sm">
        
      </div>
    </section>

    
    <section id="data-processing" class="bg-white rounded-xl shadow p-6">
      <h2 class="text-lg font-semibold mb-4">Data Processing</h2>
      <div id="data-processing-content" class="text-slate-400 text-sm">
      
      </div>
    </section>

  </main>

 
  <footer class="text-center text-xs text-slate-500 py-4">
  
  </footer>

  <script src="script.js"></script>
</body>
</html>
